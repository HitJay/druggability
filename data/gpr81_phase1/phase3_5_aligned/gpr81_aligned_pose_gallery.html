<!doctype html><html><head><meta charset="utf-8"><title>HCAR1 GPR81 Phase 3.5 aligned poses</title><script src="https://3Dmol.org/build/3Dmol-min.js"></script><style>body{font-family:Arial;background:#111;color:#eee}section{margin:20px auto;max-width:1100px}.viewer{height:520px;border:1px solid #555}</style></head><body><h1>HCAR1/GPR81 aligned docking poses</h1><p>Fixed frame: 8Z87. Receptor chain R aligned by common Cα residues. Computational hypotheses only.</p><section><h2>3_5_DHBA</h2><div class='viewer' id='v_3_5_DHBA'></div><script>addViewer('v_3_5_DHBA', '3_5_DHBA');</script></section><section><h2>3_OBA</h2><div class='viewer' id='v_3_OBA'></div><script>addViewer('v_3_OBA', '3_OBA');</script></section><section><h2>AZ1_GPR81_agonist_2</h2><div class='viewer' id='v_AZ1_GPR81_agonist_2'></div><script>addViewer('v_AZ1_GPR81_agonist_2', 'AZ1_GPR81_agonist_2');</script></section><section><h2>CHBA</h2><div class='viewer' id='v_CHBA'></div><script>addViewer('v_CHBA', 'CHBA');</script></section><section><h2>GPR81_agonist_1</h2><div class='viewer' id='v_GPR81_agonist_1'></div><script>addViewer('v_GPR81_agonist_1', 'GPR81_agonist_1');</script></section><script>const rec={"8Z87": "receptors/8Z87_aligned_to_8Z87.pdb", "9KT9": "receptors/9KT9_aligned_to_8Z87.pdb", "8Z8A": "receptors/8Z8A_aligned_to_8Z87.pdb"};const poses={"3_5_DHBA": {"8Z87": "poses/3_5_DHBA_8Z87_aligned_to_8Z87.pdbqt", "9KT9": "poses/3_5_DHBA_9KT9_aligned_to_8Z87.pdbqt", "8Z8A": "poses/3_5_DHBA_8Z8A_aligned_to_8Z87.pdbqt"}, "3_OBA": {"8Z87": "poses/3_OBA_8Z87_aligned_to_8Z87.pdbqt", "9KT9": "poses/3_OBA_9KT9_aligned_to_8Z87.pdbqt", "8Z8A": "poses/3_OBA_8Z8A_aligned_to_8Z87.pdbqt"}, "AZ1_GPR81_agonist_2": {"8Z87": "poses/AZ1_GPR81_agonist_2_8Z87_aligned_to_8Z87.pdbqt", "9KT9": "poses/AZ1_GPR81_agonist_2_9KT9_aligned_to_8Z87.pdbqt", "8Z8A": "poses/AZ1_GPR81_agonist_2_8Z8A_aligned_to_8Z87.pdbqt"}, "CHBA": {"8Z87": "poses/CHBA_8Z87_aligned_to_8Z87.pdbqt", "9KT9": "poses/CHBA_9KT9_aligned_to_8Z87.pdbqt", "8Z8A": "poses/CHBA_8Z8A_aligned_to_8Z87.pdbqt"}, "GPR81_agonist_1": {"8Z87": "poses/GPR81_agonist_1_8Z87_aligned_to_8Z87.pdbqt", "9KT9": "poses/GPR81_agonist_1_9KT9_aligned_to_8Z87.pdbqt", "8Z8A": "poses/GPR81_agonist_1_8Z8A_aligned_to_8Z87.pdbqt"}};function addViewer(id,cid){let e=document.getElementById(id),v=$3Dmol.createViewer(e,{backgroundColor:'#111'});Object.entries(rec).forEach(([rid,p])=>fetch(p).then(r=>r.text()).then(t=>{v.addModel(t,'pdb');v.setStyle({model:-1},{cartoon:{color:rid==='8Z87'?'white':rid==='9KT9'?'cyan':'magenta',opacity:0.35}});return fetch(poses[cid][rid]);}).then(r=>r.text()).then(t=>{v.addModel(t,'pdbqt');v.setStyle({model:-1},{stick:{colorscheme:'greenCarbon'}});v.zoomTo();v.render();}));}</script></body></html>
