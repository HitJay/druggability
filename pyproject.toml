[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litkit"
version = "0.1.0"
description = "学术文献检索 + 解析 + 可药性评估工具包 — 用于 druggability 研究的文献挖掘流水线"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Druggability Team"},
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # 学术检索
    "pyalex>=0.14",
    "arxiv>=2.0",
    "biopython>=1.80",
    "habanero>=2.0",
    "semanticscholar>=0.12",
    "requests>=2.28",
    # PDF 解析
    "pymupdf>=1.23",
    "pdfplumber>=0.10",
    # 生医方向
    "chembl-webresource-client>=0.10",
    "chembl-downloader>=0.5",
    "mygene>=3.2",
    # 工具 & Notebook
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tqdm>=4.60",
    "pandas>=2.0",
]

[project.scripts]
litkit = "litkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3.0",
]
scispacy = ["scispacy"]
paperqa = ["paper-qa"]

[project.urls]
Homepage = "https://github.com/HitJay/druggability"
Source = "https://github.com/HitJay/druggability"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
timeout = 60
timeout_method = "thread"
markers = [
    "network: marks tests that require network access (select with '-m network')",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = false