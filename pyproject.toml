[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbbkit"
version = "0.1.0"
description = "血脑屏障（BBB）通透性预测与药物设计工具包"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Druggability Team"},
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # 学术检索
    "pyalex>=0.14",
    "arxiv>=2.0",
    "biopython>=1.80",
    "habanero>=2.0",
    "semanticscholar>=0.12",
    "requests>=2.28",
    # PDF 解析
    "pymupdf>=1.23",
    "pdfplumber>=0.10",
    # 生医方向
    "chembl-webresource-client>=0.10",
    "mygene>=3.2",
    # Image-to-SMILES（默认后端）
    "decimer>=2.8.0",
    # 报告生成（LLM 叙述 + HTML + PPTX）
    "openai>=1.0",
    "python-pptx>=0.6.21",
    "jinja2>=3.0",
    "markdown>=3.4",
    # 工具 & Notebook
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tqdm>=4.60",
    "pandas>=2.0",
]

[project.scripts]
bbbkit = "bbbkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3.0",
]
scispacy = ["scispacy"]
paperqa = ["paper-qa"]
# 肽性质预测平台（ESM-2 基座 + 轻量任务头）
peptide = [
    "torch>=2.0",
    "fair-esm>=2.0",
    "scikit-learn>=1.1",
    "numpy>=1.23",
]

[project.urls]
Homepage = "https://github.com/HitJay/druggability"
Source = "https://github.com/HitJay/druggability"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
timeout = 60
timeout_method = "thread"
markers = [
    "network: marks tests that require network access (select with '-m network')",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = false